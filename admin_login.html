<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Gold Lotus Innovations</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin.css') }}">
</head>

<body class="admin-login-page">

    <div class="login-container">

        <div class="login-card">

            <img
                src="{{ url_for('static', filename='images/Logo image.png') }}"
                alt="Gold Lotus Innovations Logo"
                class="login-logo"
            >

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Gold Lotus Innovations
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('admin_login') }}" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Login to Dashboard
                </button>

            </form>

            <a href="{{ url_for('home') }}" class="back-link">
                ← Back to Website
            </a>

            <p class="login-footer">
                © 2026 Gold Lotus Innovations
            </p>

        </div>

    </div>

</body>
</html>
